[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "signalis-backend"
version = "1.0.0"
description = "Agentic buying-signal copilot API: FastAPI service orchestrating a 5-agent LangGraph pipeline over TrueForge."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "langgraph",
    "google-genai",
    "mcp",
    "daytona",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
