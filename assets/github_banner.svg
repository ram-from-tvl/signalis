<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Import the specific brand fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
    
    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 140px;
      fill: #222724; /* Deep sage-slate */
    }
    .subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px;
      font-weight: 500;
      fill: #616B66; /* Muted sage-slate */
      letter-spacing: -0.01em;
    }
  </style>

  <!-- Warm Off-White Background (60% dominant color) -->
  <rect width="100%" height="100%" fill="#FDFDFA" />
  
  <!-- Subtle background grid to hint at structure/data -->
  <g stroke="#E8E9E3" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="256" y1="0" x2="256" y2="640" />
    <line x1="512" y1="0" x2="512" y2="640" />
    <line x1="768" y1="0" x2="768" y2="640" />
    <line x1="1024" y1="0" x2="1024" y2="640" />
  </g>

  <!-- Iconography: Minimalist Agent Node Graph (Terracotta Accent) -->
  <g transform="translate(340, 320)">
    <!-- Outer connection ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#CD664D" stroke-width="10" stroke-opacity="0.2" />
    
    <!-- Inner structure ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#CD664D" stroke-width="10" stroke-opacity="0.4" />
    
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="24" fill="#CD664D" />

    <!-- Agent Node 1 (Top Right - Signal Extraction) -->
    <line x1="17" y1="-17" x2="92" y2="-92" stroke="#CD664D" stroke-width="10" stroke-linecap="round" />
    <circle cx="92" cy="-92" r="18" fill="#CD664D" />
    <circle cx="130" cy="-130" r="8" fill="#CD664D" opacity="0.6"/>
    <line x1="92" y1="-92" x2="130" y2="-130" stroke="#CD664D" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round" />

    <!-- Agent Node 2 (Right - Persona Fit) -->
    <line x1="24" y1="0" x2="130" y2="0" stroke="#CD664D" stroke-width="10" stroke-linecap="round" />
    <circle cx="130" cy="0" r="14" fill="#FDFDFA" stroke="#CD664D" stroke-width="8" />

    <!-- Agent Node 3 (Bottom - Buying Stage) -->
    <line x1="0" y1="24" x2="0" y2="130" stroke="#CD664D" stroke-width="10" stroke-linecap="round" />
    <circle cx="0" cy="130" r="20" fill="#CD664D" />

    <!-- Agent Node 4 (Left - Outreach Planner) -->
    <line x1="-24" y1="0" x2="-75" y2="0" stroke="#CD664D" stroke-width="10" stroke-linecap="round" />
    <circle cx="-75" cy="0" r="12" fill="#CD664D" />

    <!-- Signal Arc / Broadcast wave -->
    <path d="M -92 -92 A 130 130 0 0 1 34 -125" fill="none" stroke="#CD664D" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M -115 -115 A 165 165 0 0 1 45 -160" fill="none" stroke="#CD664D" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- Typography -->
  <text x="540" y="340" class="title">Signalis</text>
  <text x="548" y="420" class="subtitle">Agentic buying-signal copilot for GTM teams</text>
</svg>
